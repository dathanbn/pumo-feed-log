<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pumo Feed Log</title>
<meta name="description" content="Tap to see when Pumo was last fed and log a new feed.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-app="pumo-feed-log">
<div class="page">

  <div id="refresh-banner" class="banner" hidden></div>

  <header class="header">
    <div id="avatar" class="avatar"></div>
    <div class="header__text">
      <h1>Pumo</h1>
      <p class="tagline">Don't trust the meows.</p>
    </div>
  </header>

  <div id="data-block">
    <section class="headline">
      <p class="headline__line">
        <span class="label" id="headline-label">Last fed</span>
        <span class="value" id="headline-value">&ndash;</span>
      </p>
    </section>

    <p id="counter" class="counter">&ndash; of 4 today</p>

    <section class="recent" id="recent-section" aria-busy="true">
      <h2 class="recent__label" id="recent-heading">Recent</h2>
      <ul id="recent-list" class="row-list"></ul>
      <p id="recent-empty" class="recent__empty" hidden></p>
    </section>
  </div>

  <div id="error-block" hidden></div>

  <button id="log-button" type="button" class="log-button" disabled>Loading&hellip;</button>

  <div id="undo-notice" class="undo-notice" hidden role="status"></div>

  <a class="history-link" href="history.html">Full history <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>

  <section id="name-card" class="name-card" hidden>
    <h2 class="name-card__title">Who's feeding Pumo?</h2>
    <p class="name-card__body">Pick a name for this phone so everyone sees who logged each feed. No account needed.</p>
    <label class="name-card__label" for="name-input">Your name</label>
    <input id="name-input" class="name-card__input" type="text" placeholder="e.g. Sam" maxlength="20" autocomplete="given-name" enterkeyhint="done">
    <div class="name-card__buttons">
      <button id="name-save" type="button" class="btn btn--accent" disabled>Save</button>
      <button id="name-skip" type="button" class="btn btn--text">Skip</button>
    </div>
  </section>

  <p id="footer" class="footer"></p>

</div>
<script type="module" src="js/home.js"></script>
</body>
</html>
