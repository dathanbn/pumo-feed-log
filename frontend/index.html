<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pumo Feed Log</title>
<meta name="description" content="Tap to see when Pumo was last fed and log a new feed.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF2E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1913" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-app="pumo-feed-log">
<div id="status-region" class="visually-hidden" role="status" aria-live="polite"></div>
<div class="page">

  <div id="refresh-banner" class="banner" hidden></div>

  <header class="header">
    <div id="avatar" class="avatar"></div>
    <div class="header__text">
      <h1>Pumo</h1>
      <p class="tagline">Don't trust the meows.</p>
    </div>
  </header>

  <div id="data-block">
    <section class="headline">
      <p class="headline__line">
        <span class="label" id="headline-label"><svg class="icon" width="15" height="15" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><ellipse cx="4.2" cy="7.8" rx="2.4" ry="3.1" transform="rotate(-16 4.2 7.8)"/><ellipse cx="8.1" cy="4.4" rx="2.6" ry="3.6" transform="rotate(-8 8.1 4.4)"/><ellipse cx="12.3" cy="4.4" rx="2.6" ry="3.6" transform="rotate(8 12.3 4.4)"/><ellipse cx="16.2" cy="7.8" rx="2.4" ry="3.1" transform="rotate(16 16.2 7.8)"/><path d="M10.2 9.4 C13.6 9.4 16.8 11.6 17 14.4 C17.2 16.6 15.8 18.2 13.6 18.6 C12.8 18.8 12 18.4 11.6 17.7 C11.4 18.4 11 18.8 10.2 18.8 C9.4 18.8 9 18.4 8.8 17.7 C8.4 18.4 7.6 18.8 6.8 18.6 C4.6 18.2 3.2 16.6 3.4 14.4 C3.6 11.6 6.8 9.4 10.2 9.4 Z"/></svg>Last fed</span>
        <span class="value" id="headline-value">&ndash;</span>
      </p>
    </section>

    <p id="counter" class="counter">&ndash; of 4 today</p>

    <section class="recent" id="recent-section" aria-busy="true">
      <h2 class="recent__label" id="recent-heading">Recent</h2>
      <ul id="recent-list" class="row-list"></ul>
      <p id="recent-empty" class="recent__empty" hidden></p>
    </section>
  </div>

  <div id="error-block" hidden></div>

  <button id="log-button" type="button" class="log-button" disabled>Loading&hellip;</button>

  <div id="undo-notice" class="undo-notice" hidden role="status"></div>

  <a class="history-link" href="history.html">Full history <svg class="chevron" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg></a>

  <section id="name-card" class="name-card" hidden>
    <h2 class="name-card__title"><svg class="icon" width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><ellipse cx="4.2" cy="7.8" rx="2.4" ry="3.1" transform="rotate(-16 4.2 7.8)"/><ellipse cx="8.1" cy="4.4" rx="2.6" ry="3.6" transform="rotate(-8 8.1 4.4)"/><ellipse cx="12.3" cy="4.4" rx="2.6" ry="3.6" transform="rotate(8 12.3 4.4)"/><ellipse cx="16.2" cy="7.8" rx="2.4" ry="3.1" transform="rotate(16 16.2 7.8)"/><path d="M10.2 9.4 C13.6 9.4 16.8 11.6 17 14.4 C17.2 16.6 15.8 18.2 13.6 18.6 C12.8 18.8 12 18.4 11.6 17.7 C11.4 18.4 11 18.8 10.2 18.8 C9.4 18.8 9 18.4 8.8 17.7 C8.4 18.4 7.6 18.8 6.8 18.6 C4.6 18.2 3.2 16.6 3.4 14.4 C3.6 11.6 6.8 9.4 10.2 9.4 Z"/></svg>Who's feeding Pumo?</h2>
    <p class="name-card__body">Pick a name for this phone so everyone sees who logged each feed. No account needed.</p>
    <label class="name-card__label" for="name-input">Your name</label>
    <input id="name-input" class="name-card__input" type="text" placeholder="e.g. Sam" maxlength="20" autocomplete="given-name" enterkeyhint="done">
    <div class="name-card__buttons">
      <button id="name-save" type="button" class="btn btn--accent" disabled>Save</button>
      <button id="name-skip" type="button" class="btn btn--text">Skip</button>
    </div>
  </section>

  <p id="footer" class="footer"></p>

</div>
<script type="module" src="js/home.js"></script>
</body>
</html>
